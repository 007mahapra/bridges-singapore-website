<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traditional Indian Music Lyrics</title>
    
    <!-- Google Fonts for Traditional Indian Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Lora:ital,wght@0,400..700;1,400..700&family=Rozha+One&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. CORE STYLES & TRADITIONAL THEME
           ========================================================================== */
        :root {
            --bg-maroon: #2a080c;
            --bg-card: #1c0508;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-cream: #fffdd0;
            --text-muted: #c0a880;
            --border-gold: rgba(212, 175, 55, 0.4);
            --shadow-gold: rgba(212, 175, 55, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Prevents easy text selection/copying */
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-maroon);
            background-image: radial-gradient(circle at 50% 0%, #4a0d15 0%, var(--bg-maroon) 70%);
            color: var(--text-cream);
            font-family: 'Lora', serif;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* ==========================================================================
           2. HEADER & SEARCH BAR
           ========================================================================== */
        header {
            text-align: center;
            padding: 40px 20px 20px;
            position: sticky;
            top: 0;
            background: rgba(42, 8, 12, 0.95);
            backdrop-filter: blur(8px);
            z-index: 100;
            border-bottom: 1px solid var(--border-gold);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: 'Rozha One', serif;
            color: var(--gold-primary);
            font-size: 2.5rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .subtitle {
            font-family: 'Cinzel Decorative', cursive;
            color: var(--gold-light);
            font-size: 0.9rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 22px;
            font-size: 1.1rem;
            border-radius: 30px;
            border: 2px solid var(--gold-primary);
            background: rgba(15, 3, 5, 0.8);
            color: var(--text-cream);
            outline: none;
            box-shadow: 0 0 15px var(--shadow-gold);
            transition: all 0.3s ease;
            font-family: 'Lora', serif;
        }

        .search-input:focus {
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            border-color: var(--gold-light);
        }

        .search-input::placeholder {
            color: var(--text-muted);
            font-style: italic;
        }

        /* ==========================================================================
           3. SONG CARDS CONTAINER
           ========================================================================== */
        .container {
            max-width: 720px;
            margin: 30px auto 0;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        .song-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            padding: 25px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }

        /* Gold Decorative Corner Borders */
        .song-card::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            pointer-events: none;
        }

        .song-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px var(--shadow-gold);
            border-color: var(--gold-primary);
        }

        .song-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border-gold);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .song-number {
            background: var(--gold-primary);
            color: var(--bg-maroon);
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-family: sans-serif;
        }

        .song-title {
            font-family: 'Rozha One', serif;
            color: var(--gold-light);
            font-size: 1.3rem;
            flex-grow: 1;
            margin-left: 10px;
        }

        .song-lyrics {
            white-space: pre-line;
            line-height: 1.8;
            font-size: 1.05rem;
            color: var(--text-cream);
            flex-grow: 1;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-size: 1.2rem;
            display: none;
        }

        /* ==========================================================================
           4. PRINT DISABLE STYLES (PREVENTS PRINTING)
           ========================================================================== */
        @media print {
            body {
                display: none !important;
            }
        }
    </style>
</head>
<body oncontextmenu="return false;"> <!-- Disables right-click to prevent easy copy/print -->

    <header>
        <h1>Ehssas-E-Sukoon</h1>
        <div class="subtitle">Music Lyrics - Sing Along</div>
        <div class="search-container">
            <input 
                type="text" 
                id="searchInput" 
                class="search-input" 
                placeholder="Search by song number (e.g., '1') or lyrics text..."
                onkeyup="filterSongs()"
            >
        </div>
    </header>

    <main class="container" id="songsContainer">
        <!-- Song cards will be auto-generated here -->
    </main>

    <div class="no-results" id="noResults">
        No matching songs found.
    </div>
    <script src="songs.js"></script>
    <script>
        /* ==========================================================================
           5. SONG DATA ARRAY
           The songDatabase variable is loaded from songs.js.
           ========================================================================== */
        
        /* ==========================================================================
           6. DYNAMIC RENDERING & SEARCH LOGIC
           ========================================================================== */
        const container = document.getElementById('songsContainer');
        const noResults = document.getElementById('noResults');

        // Function to render song cards
        function renderSongs(songs) {
            container.innerHTML = '';
            
            if (songs.length === 0) {
                noResults.style.display = 'block';
                return;
            } else {
                noResults.style.display = 'none';
            }

            songs.forEach(song => {
                const card = document.createElement('div');
                card.className = 'song-card';
                card.innerHTML = `
                    <div class="song-header">
                        <span class="song-number">Song ${song.id}</span>
                        <h2 class="song-title">${song.title}</h2>
                    </div>
                    <div class="song-lyrics">${song.lyrics}</div>
                `;
                container.appendChild(card);
            });
        }

        // Live Search Filter (searches both song number & lyrics text)
        function filterSongs() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            const filtered = songDatabase.filter(song => {
                const matchesId = song.id.toString() === query || `song ${song.id}`.includes(query);
                const matchesTitle = song.title.toLowerCase().includes(query);
                const matchesLyrics = song.lyrics.toLowerCase().includes(query);
                return matchesId || matchesTitle || matchesLyrics;
            });

            renderSongs(filtered);
        }

        // Initial Load
        renderSongs(songDatabase);

        /* ==========================================================================
           7. ADDITIONAL PRINT / COPY PROTECTION
           ========================================================================== */
        // Block CTRL+P / CMD+P shortcut
        window.addEventListener('keydown', function (e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.keyCode === 80)) {
                e.preventDefault();
                alert('Printing is disabled for this lyrics page.');
            }
        });
    </script>
</body>
</html>
